<!DOCTYPE html>
<html lang="ru">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRIZ — Порушення</title>
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <div id="app">

    <div class="header-card">
      <div class="greeting" id="greeting-text">Добрый день</div>
      <div class="greeting-name">PRIZ Харків</div>
    </div>

    <div id="screen-add" class="screen active">
      <div class="card">
        <h2>Вставить текст</h2>
        <textarea id="raw-text" placeholder="ТТ, ФИО, дата… фабула…"></textarea>
        <button class="secondary" id="parse-btn">Разобрать</button>
      </div>

      <div class="card">
        <div class="field" id="field-store">
          <label>ТТ</label>
          <div class="combo">
            <input type="text" id="store-input" placeholder="Номер или название" autocomplete="off">
            <div class="combo-list" id="store-list"></div>
          </div>
          <div class="field-note hidden" id="store-note">ТТ не найдена в справочнике</div>
        </div>

        <label>Менеджер</label>
        <input type="text" id="manager-input" disabled>

        <div class="field" id="field-employee">
          <label>ФИО сотрудника ТТ</label>
          <input type="text" id="employee-input">
        </div>

        <div class="field" id="field-fabula">
          <label>Фабула</label>
          <textarea id="fabula-input"></textarea>
        </div>

        <div class="field" id="field-violation">
          <label>Тип нарушения</label>
          <select id="violation-select">
            <option value="">— выберите —</option>
          </select>
          <div class="field-note hidden" id="violation-note">Тип определён автоматически, проверьте</div>
          <div class="chips hidden" id="violation-chips"></div>
        </div>

        <div id="damage-block" class="hidden">
          <label>Ущерб (только 1 категория)</label>
          <div class="damage-row">
            <div class="field">
              <input type="number" id="damage-customer" placeholder="Ущерб покупателю">
            </div>
            <div class="field">
              <input type="number" id="damage-store" placeholder="Ущерб магазину">
            </div>
            <div class="field">
              <input type="number" id="damage-reimbursed-customer" placeholder="Возмещено покупателю">
            </div>
            <div class="field">
              <input type="number" id="damage-reimbursed-store" placeholder="Возмещено магазину">
            </div>
          </div>
        </div>

        <button class="primary" id="submit-btn">Внести</button>
        <button class="secondary hidden" id="cancel-edit-btn">Отменить редактирование</button>
      </div>
    </div>

    <div id="screen-list" class="screen">
      <div class="card">
        <h2>Последние записи</h2>
        <div id="records-container"></div>
      </div>
    </div>

    <div id="screen-bulk" class="screen">
      <div class="card">
        <h2>Вставить несколько нарушений</h2>
        <textarea id="bulk-text" placeholder="Каждое нарушение отдельным абзацем, через пустую строку" style="min-height:140px"></textarea>
        <button class="secondary" id="bulk-parse-btn">Разобрать</button>
      </div>
      <div id="bulk-results"></div>
      <button class="primary hidden" id="bulk-submit-btn">Внести отмеченные</button>
    </div>

    <div id="screen-eval" class="screen">
      <div class="card">
        <h2 id="eval-form-title">Оценка обслуживания</h2>

        <div class="field" id="eval-field-store">
          <label>ТТ</label>
          <div class="combo">
            <input type="text" id="eval-store-input" placeholder="Номер или название" autocomplete="off">
            <div class="combo-list" id="eval-store-list"></div>
          </div>
        </div>

        <label>Менеджер</label>
        <input type="text" id="eval-manager-input" disabled>

        <label>Продавец</label>
        <input type="text" id="eval-seller-input" placeholder="ФИО продавца">

        <div class="damage-row">
          <div class="field">
            <label>Время (ЧЧ:ММ)</label>
            <input type="text" id="eval-time-input" placeholder="12:43" inputmode="numeric">
          </div>
          <div class="field">
            <label>Пол покупателя</label>
            <select id="eval-gender-select">
              <option value="м">м</option>
              <option value="ж">ж</option>
            </select>
          </div>
        </div>

        <label>Комментарий</label>
        <textarea id="eval-comment-input" placeholder="Например: нет доп. предложений, рульку озвучила"></textarea>

        <button class="primary" id="eval-submit-btn">Внести оценку</button>
        <button class="secondary hidden" id="eval-cancel-edit-btn">Отменить редактирование</button>
      </div>

      <div class="card">
        <h2>Последние оценки</h2>
        <div id="eval-records-container"></div>
      </div>
    </div>

    <nav class="tabbar">
      <button class="tab-btn active" data-screen="add">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Внести</span>
      </button>
      <button class="tab-btn" data-screen="bulk">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="4" rx="1"/><rect x="4" y="10" width="16" height="4" rx="1"/><rect x="4" y="16" width="16" height="4" rx="1"/></svg>
        <span>Массово</span>
      </button>
      <button class="tab-btn" data-screen="eval">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.8 1.4 6.8L12 17.6 5.9 20.7l1.4-6.8-5.1-4.8 6.9-.8z"/></svg>
        <span>Оценка</span>
      </button>
      <button class="tab-btn" data-screen="list">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span>Последние</span>
      </button>
    </nav>
  </div>

  <div id="loader"></div>
  <div id="toast"></div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
